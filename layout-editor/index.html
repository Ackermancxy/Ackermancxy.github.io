<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Layout Editor</title>
<style>
:root{
  --bg:#f3efe8;--paper:#fdfaf5;
  --text:#3a3530;--muted:#9a9488;
  --accent:rgba(199,125,97,0.35);
  --accent-solid:#c77d61;
  --illust:rgba(180,155,130,0.15);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}

header{
  width:100%;max-width:600px;padding:14px 18px 6px;
  display:flex;align-items:center;justify-content:space-between;
}
header h1{font-size:1.05rem;font-weight:600;letter-spacing:-0.01em}
header .badge{font-size:0.62rem;color:var(--muted);background:var(--paper);border:1px solid #e5ded4;padding:3px 10px;border-radius:10px}

.stage{
  flex:1;width:100%;max-width:600px;
  display:flex;align-items:center;justify-content:center;
  padding:10px 18px;min-height:0;
}
.canvas{
  position:relative;background:var(--paper);
  box-shadow:0 2px 24px rgba(0,0,0,0.06),0 0 0 1px rgba(0,0,0,0.03);
  border-radius:3px;max-height:100%;
  aspect-ratio:var(--rw)/var(--rh);
  touch-action:none;overflow:hidden;
}

/* 虚 — illustration fills entire canvas */
.illust-layer{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:var(--illust);
}

/* 实 — photo block */
.block{
  position:absolute;z-index:2;cursor:grab;touch-action:none;
  background:var(--accent);
  border-radius:14px;
  border:1.5px solid rgba(199,125,97,0.2);
  transition:border-radius 0.2s,background 0.2s;
  box-shadow:0 0 0 1px rgba(199,125,97,0.08) inset;
}
.block:active{cursor:grabbing}
.block .label{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(0.5rem,1vw,0.65rem);font-weight:500;
  color:rgba(199,125,97,0.4);pointer-events:none;
  letter-spacing:0.08em;text-transform:uppercase;
}
/* when illustration is the draggable block */
.block.is-illust{
  background:rgba(180,155,130,0.2);
  border-color:rgba(180,155,130,0.2);
  box-shadow:0 0 0 1px rgba(180,155,130,0.06) inset;
}
.block.is-illust .label{color:rgba(180,155,130,0.4)}

/* the complementary backdrop */
.backdrop{
  position:absolute;inset:0;z-index:0;pointer-events:none;
}
.backdrop .fill{
  position:absolute;inset:0;
  background:var(--illust);
}

/* handles */
.handle{
  position:absolute;width:20px;height:20px;
  background:#fff;border:2px solid rgba(0,0,0,0.2);
  border-radius:50%;z-index:10;
  transform:translate(-50%,-50%);
  box-shadow:0 1px 4px rgba(0,0,0,0.1);
  transition:transform 0.12s,background 0.12s,border-color 0.12s;
}
.handle:active{background:var(--accent-solid);border-color:var(--accent-solid);transform:translate(-50%,-50%) scale(1.35)}
.nw{top:0;left:0}
.ne{top:0;left:100%}
.sw{top:100%;left:0}
.se{top:100%;left:100%}
.n{top:0;left:50%}
.s{top:100%;left:50%}
.w{top:50%;left:0}
.e{top:50%;left:100%}

.bar{
  width:100%;max-width:600px;padding:8px 18px 14px;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;
}
.chip-row{
  display:flex;gap:3px;
  background:var(--paper);border:1px solid #e5ded4;
  border-radius:9px;padding:3px;
}
.chip{
  padding:5px 10px;font-size:0.7rem;font-weight:500;
  border-radius:7px;cursor:pointer;color:var(--muted);
  white-space:nowrap;border:none;background:none;
  transition:all 0.15s;
}
.chip.on{background:var(--text);color:var(--bg)}
.chip:active{opacity:0.7}

.act{
  padding:6px 12px;font-size:0.7rem;font-weight:500;
  border:1px solid #e5ded4;border-radius:9px;cursor:pointer;
  color:var(--muted);background:var(--paper);white-space:nowrap;
}
.act:active{background:#e5ded4}
.act.go{background:var(--text);color:var(--bg);border-color:var(--text)}
.act.go:active{opacity:0.8}
.act.swap{background:var(--accent);color:var(--accent-solid);border-color:rgba(199,125,97,0.2)}
.act.swap:active{opacity:0.8}

.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);
  padding:10px 22px;border-radius:10px;
  font-size:0.75rem;z-index:100;
  opacity:0;pointer-events:none;transition:opacity 0.3s;
  max-width:90vw;text-align:center;
}
.toast.show{opacity:1}

@media(max-width:480px){
  header{padding:10px 14px 4px}
  header h1{font-size:0.95rem}
  .stage{padding:6px 12px}
  .bar{padding:6px 12px 12px;gap:5px}
  .chip{padding:5px 8px;font-size:0.66rem}
  .act{padding:5px 10px;font-size:0.66rem}
  .handle{width:26px;height:26px}
}
</style>
</head>
<body>

<header>
  <h1>Layout Editor</h1>
  <span class="badge">Gathered Scenes</span>
</header>

<div class="stage" id="stage">
  <div class="canvas" id="cv">
    <div class="illust-layer" id="illustBg"></div>
    <div class="block" id="block"><span class="label">PHOTO</span></div>
  </div>
</div>

<div class="bar" id="bar">
  <div class="chip-row" id="ratioRow"></div>
  <button class="act swap" id="layerBtn">插画在上</button>
  <div class="chip-row" id="presetRow"></div>
  <button class="act go" id="applyBtn" style="display:none">应用</button>
  <button class="act go" id="copyBtn">复制</button>
</div>

<div class="toast" id="toast"></div>

<script>
(()=>{
const s={rw:3,rh:5,px:5,py:5,pw:90,ph:45,photoOnTop:true};
const stage=document.getElementById('stage');
const cv=document.getElementById('cv');
const blk=document.getElementById('block');
const illustBg=document.getElementById('illustBg');
const toast=document.getElementById('toast');
const layerBtn=document.getElementById('layerBtn');

// build handles
['nw','n','ne','e','se','s','sw','w'].forEach(d=>{
  const h=document.createElement('div');h.className='handle '+d;h.dataset.dir=d;blk.appendChild(h);
});

function resize(){
  const maxH=stage.clientHeight-20;
  const maxW=stage.clientWidth-20;
  const r=s.rw/s.rh;
  let w,h;
  if(maxH*r<=maxW){h=maxH;w=h*r}else{w=maxW;h=w/r}
  cv.style.width=w+'px';cv.style.height=h+'px';
  document.documentElement.style.setProperty('--rw',s.rw);
  document.documentElement.style.setProperty('--rh',s.rh);
  apply();
}
function apply(){
  const cw=cv.clientWidth,ch=cv.clientHeight;
  blk.style.left=(s.px/100*cw)+'px';
  blk.style.top=(s.py/100*ch)+'px';
  blk.style.width=(s.pw/100*cw)+'px';
  blk.style.height=(s.ph/100*ch)+'px';
}

// --- drag & resize ---
let drag=null,ds={};

blk.addEventListener('mousedown',e=>{
  if(e.target.classList.contains('handle'))return;
  drag='move';const p={x:e.clientX,y:e.clientY,px:s.px,py:s.py};ds=p;
});
blk.addEventListener('touchstart',e=>{
  if(e.target.classList.contains('handle'))return;
  drag='move';const t=e.touches[0];ds={x:t.clientX,y:t.clientY,px:s.px,py:s.py};
},{passive:false});

blk.querySelectorAll('.handle').forEach(h=>{
  h.addEventListener('mousedown',e=>{
    e.stopPropagation();drag='resize';
    ds={x:e.clientX,y:e.clientY,px:s.px,py:s.py,pw:s.pw,ph:s.ph,dir:h.dataset.dir};
  });
  h.addEventListener('touchstart',e=>{
    e.stopPropagation();drag='resize';
    const t=e.touches[0];
    ds={x:t.clientX,y:t.clientY,px:s.px,py:s.py,pw:s.pw,ph:s.ph,dir:h.dataset.dir};
  },{passive:false});
});

function onMove(e){
  if(!drag)return;e.preventDefault();
  const pt=e.touches?e.touches[0]:e;
  const cw=cv.clientWidth,ch=cv.clientHeight;
  const dx=(pt.clientX-ds.x)/cw*100;
  const dy=(pt.clientY-ds.y)/ch*100;
  if(drag==='move'){
    s.px=Math.max(0,Math.min(100-s.pw,ds.px+dx));
    s.py=Math.max(0,Math.min(100-s.ph,ds.py+dy));
  }else{
    const d=ds.dir;
    if(d.includes('e'))s.pw=Math.round(Math.max(10,Math.min(100-s.px,ds.pw+dx)));
    if(d.includes('w')){const n=Math.max(0,Math.min(ds.px+ds.pw-10,ds.px+dx));s.px=Math.round(n);s.pw=Math.round(ds.px+ds.pw-s.px)}
    if(d.includes('s'))s.ph=Math.round(Math.max(10,Math.min(100-s.py,ds.ph+dy)));
    if(d.includes('n')){const n=Math.max(0,Math.min(ds.py+ds.ph-10,ds.py+dy));s.py=Math.round(n);s.ph=Math.round(ds.py+ds.ph-s.py)}
  }
  s.px=Math.max(0,Math.min(95,Math.round(s.px)));
  s.py=Math.max(0,Math.min(95,Math.round(s.py)));
  s.pw=Math.max(10,Math.min(90,Math.round(s.pw)));
  s.ph=Math.max(10,Math.min(90,Math.round(s.ph)));
  if(s.px+s.pw>100)s.pw=100-s.px;
  if(s.py+s.ph>100)s.ph=100-s.py;
  apply();
}
function onEnd(){drag=null}
document.addEventListener('mousemove',onMove);
document.addEventListener('touchmove',onMove,{passive:false});
document.addEventListener('mouseup',onEnd);
document.addEventListener('touchend',onEnd);

// --- layer toggle ---
function updateLayerUI(){
  if(s.photoOnTop){
    blk.classList.remove('is-illust');
    blk.querySelector('.label').textContent='PHOTO';
    layerBtn.textContent='插画在上';
    illustBg.style.opacity='1';
  } else {
    blk.classList.add('is-illust');
    blk.querySelector('.label').textContent='ILLUST';
    layerBtn.textContent='照片在上';
    illustBg.style.opacity='0.15';
  }
}
layerBtn.addEventListener('click',()=>{
  s.photoOnTop=!s.photoOnTop;updateLayerUI();
  showToast(s.photoOnTop?'照片在上层 · 插画在底层':'插画在上层 · 照片在底层');
});

// --- chips ---
function chips(rowId,items,onClick){
  const wrap=document.getElementById(rowId);
  items.forEach((it,i)=>{
    const el=document.createElement('button');
    el.className='chip'+(i===0?' on':'');
    el.textContent=it.label;
    el.addEventListener('click',()=>{
      wrap.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
      el.classList.add('on');
      onClick(it);
    });
    wrap.appendChild(el);
  });
}

chips('ratioRow',[
  {label:'3:5',rw:3,rh:5},{label:'2:3',rw:2,rh:3},{label:'1:1',rw:1,rh:1},
  {label:'4:5',rw:4,rh:5},{label:'9:16',rw:9,rh:16},
],it=>{s.rw=it.rw;s.rh=it.rh;resize()});

chips('presetRow',[
  {label:'上实下虚',px:5,py:5,pw:90,ph:45},
  {label:'上虚下实',px:5,py:50,pw:90,ph:45},
  {label:'左实右虚',px:5,py:5,pw:43,ph:90},
  {label:'左虚右实',px:52,py:5,pw:43,ph:90},
  {label:'实嵌虚中',px:28,py:30,pw:44,ph:40},
  {label:'虚嵌实中',px:28,py:30,pw:44,ph:40},
  {label:'实为背景',px:5,py:5,pw:90,ph:90},
  {label:'虚为背景',px:20,py:20,pw:60,ph:60},
],it=>{s.px=it.px;s.py=it.py;s.pw=it.pw;s.ph=it.ph;apply()});

// --- copy ---
function buildDesc(){
  const who=s.photoOnTop?'photo':'illustration';
  return `Composition: user-defined. ${s.rw}:${s.rh} canvas. The ${who} occupies (${s.px}%,${s.py}%) ${s.pw}%×${s.ph}%. The opposite medium fills the remaining canvas. One continuous scene across the boundary.`;
}

// Show apply button when embedded in iframe
if(window!==window.parent){
  document.getElementById('applyBtn').style.display='';
  document.getElementById('applyBtn').addEventListener('click',()=>{
    window.parent.postMessage({type:'gs-layout',layout:buildDesc()},'*');
    showToast('已应用');
  });
}

document.getElementById('copyBtn').addEventListener('click',()=>{
  navigator.clipboard.writeText(buildDesc()).then(()=>showToast('已复制'));
});

function showToast(msg){
  toast.textContent=msg;toast.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),2000);
}

window.addEventListener('resize',resize);
resize();updateLayerUI();
})();
</script>
</body>
</html>
