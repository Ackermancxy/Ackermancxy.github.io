<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CXY 的摄影作品集">
  <title>摄影 · CXY</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
  <style>
    .coming-soon {
      text-align: center; padding: 80px 24px; max-width: 480px; margin: 0 auto;
    }
    .coming-soon-icon {
      font-size: 4rem; margin-bottom: 1.5rem; display: block;
      opacity: 0.5; filter: grayscale(0.6);
    }
    .coming-soon h2 {
      font-size: 1.5rem; margin-bottom: 1rem; color: var(--text);
    }
    .coming-soon p {
      color: var(--text-muted); font-size: 1rem; line-height: 1.8; margin-bottom: 2rem;
    }
    .coming-soon .back-link {
      display: inline-block; padding: 10px 28px; border: 1px solid var(--border);
      border-radius: 20px; font-size: 0.9rem; color: var(--text-muted);
      transition: all var(--transition);
    }
    .coming-soon .back-link:hover {
      border-color: var(--accent-1); color: var(--accent-1);
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">CXY</a>
      <ul class="nav-links">
        <li><a href="/">首页</a></li>
        <li><a href="/photography/">摄影</a></li>
        <li><a href="/ai-skills/">AI 技法</a></li>
        <li>
          <button id="themeToggle" class="theme-toggle" aria-label="切换主题">☀️</button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="page-header">
    <div class="container">
      <p class="hero-subtitle reveal">Photography</p>
      <h1 class="reveal">摄影选辑</h1>
      <p class="reveal">以镜头保存片刻，在明暗之间辨认叙事。</p>
    </div>
  </header>

  <!-- Coming Soon -->
  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="coming-soon reveal">
        <div class="coming-soon-icon">📷</div>
        <h2>摄影作品集正在筹备中</h2>
        <p>还在整理胶片与数字作品，精选后将会呈现。<br>敬请期待。</p>
        <a href="/" class="back-link">← 返回首页</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 CXY · 用光影与代码书写</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
