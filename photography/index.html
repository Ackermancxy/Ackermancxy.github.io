<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CXY 的摄影作品集">
  <title>摄影 · CXY</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">CXY</a>

        <li><a href="/photography/">摄影</a></li>
        <li><a href="/ai-skills/">AI 技能</a></li>
        <li>

        </li>
      </ul>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="page-header">
    <div class="container">
      <p class="hero-subtitle reveal">Photography</p>
      <h1 class="reveal">摄影作品</h1>
      <p class="reveal">用镜头定格瞬间，在光影中寻找故事。</p>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="photo-grid">
        <div class="photo-item reveal">
          <div class="placeholder">🌅</div>
        </div>
        <div class="photo-item reveal">
          <div class="placeholder">🌆</div>
        </div>
        <div class="photo-item reveal">
          <div class="placeholder">🌃</div>
        </div>
        <div class="photo-item reveal">
          <div class="placeholder">🏔️</div>
        </div>
        <div class="photo-item reveal">
          <div class="placeholder">🌊</div>
        </div>
        <div class="photo-item reveal">
          <div class="placeholder">🌸</div>
        </div>
        <div class="photo-item reveal">
          <div class="placeholder">🍂</div>
        </div>
        <div class="photo-item reveal">
          <div class="placeholder">🌉</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 CXY · 用光影与代码书写</p>
