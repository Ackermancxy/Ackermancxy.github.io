<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CXY 的 AI 作图技能收集">
  <title>AI 技能 · CXY</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <style>
    /* ============ Skill Card ============ */
    .skill-card { padding: 0; overflow: hidden; }
    .skill-card-img {
      width: 100%; aspect-ratio: 3/4; overflow: hidden; background: var(--border);
    }
    .skill-card-img img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.6s ease;
    }
    .skill-card:hover .skill-card-img img { transform: scale(1.05); }
    .skill-card-body { padding: 24px 28px 28px; }
    .skill-card-body .card-link { margin-top: 0.5rem; }

    /* ============ Skill Detail ============ */
    .skill-detail {
      display: none; margin-top: 2rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
    }
    .skill-detail.active { display: block; }
    .skill-detail-banner {
      width: 100%; aspect-ratio: 3/1; overflow: hidden; background: var(--border);
    }
    .skill-detail-banner img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .skill-detail-body { padding: 32px 40px 40px; }
    @media (max-width: 640px) { .skill-detail-body { padding: 20px 24px 24px; } }

    .skill-detail-header {
      display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;
    }
    .skill-detail-header h2 { font-size: 1.5rem; }
    .skill-detail-header .close-btn {
      background: none; border: 1px solid var(--border); border-radius: 50%;
      width: 32px; height: 32px; cursor: pointer; font-size: 1.1rem;
      color: var(--text-muted); transition: all var(--transition); flex-shrink: 0;
    }
    .skill-detail-header .close-btn:hover { color: var(--text); border-color: var(--text-muted); }
    .skill-detail-desc { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.7; }

    /* ============ Form ============ */
    .prompt-form { display: grid; gap: 28px; }
    .form-section-label {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--text-muted); font-weight: 600;
      border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px;
    }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label {
      font-size: 0.85rem; font-weight: 600; color: var(--text);
    }
    .form-group label .hint { font-weight: 400; color: var(--text-muted); font-size: 0.78rem; }
    .form-group input, .form-group textarea {
      padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font-size: 0.9rem;
      font-family: inherit; transition: border-color var(--transition);
    }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent-1); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group.full { grid-column: 1 / -1; }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }

    /* ============ Visual Selectors ============ */
    .color-swatches { display: flex; flex-wrap: wrap; gap: 10px; }
    .color-swatch {
      width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: all var(--transition);
      flex-shrink: 0; position: relative;
    }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.selected { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg-card); }
    .color-swatch .tooltip {
      position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%);
      font-size: 0.65rem; color: var(--text-muted); white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .color-swatch:hover .tooltip { opacity: 1; }

    .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip-option {
      cursor: pointer; border: 2px solid var(--border); border-radius: 20px;
      padding: 7px 16px; font-size: 0.82rem; color: var(--text-muted);
      transition: all var(--transition); background: var(--bg);
    }
    .chip-option:hover { border-color: var(--text-muted); color: var(--text); }
    .chip-option.selected {
      border-color: var(--accent-1); background: var(--bg-card); color: var(--text); font-weight: 600;
    }

    .layout-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    .layout-option {
      cursor: pointer; border: 2px solid var(--border); border-radius: 10px;
      padding: 10px 8px 8px; text-align: center;
      transition: all var(--transition); background: var(--bg);
    }
    .layout-option:hover { border-color: var(--text-muted); }
    .layout-option.selected { border-color: var(--accent-1); background: var(--bg-card); }
    .layout-diagram {
      width: 100%; aspect-ratio: 3/4; background: var(--border); border-radius: 4px;
      margin-bottom: 6px; position: relative; overflow: hidden;
    }
    .layout-diagram .dot {
      position: absolute; border-radius: 2px; background: var(--accent-1); opacity: 0.8;
    }
    .layout-option .label { font-size: 0.7rem; color: var(--text-muted); line-height: 1.2; }
    .layout-option.selected .label { color: var(--text); font-weight: 600; }

    .anchor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
    .anchor-option {
      cursor: pointer; border: 2px solid var(--border); border-radius: 10px;
      padding: 12px 8px; text-align: center;
      transition: all var(--transition); background: var(--bg);
    }
    .anchor-option:hover { border-color: var(--text-muted); }
    .anchor-option.selected { border-color: var(--accent-1); background: var(--bg-card); }
    .anchor-option .icon { font-size: 1.5rem; display: block; margin-bottom: 4px; }
    .anchor-option .label { font-size: 0.65rem; color: var(--text-muted); line-height: 1.2; }
    .anchor-option.selected .label { color: var(--text); font-weight: 600; }

    .tension-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .tension-option {
      cursor: pointer; border: 2px solid var(--border); border-radius: 10px;
      padding: 14px 8px; text-align: center;
      transition: all var(--transition); background: var(--bg);
    }
    .tension-option:hover { border-color: var(--text-muted); }
    .tension-option.selected { border-color: var(--accent-1); background: var(--bg-card); }
    .tension-option .icon { font-size: 1.3rem; display: block; margin-bottom: 4px; }
    .tension-option .label { font-size: 0.7rem; color: var(--text-muted); line-height: 1.2; }
    .tension-option.selected .label { color: var(--text); font-weight: 600; }

    /* ============ Prompt Output ============ */
    .prompt-output { display: none; margin-top: 28px; }
    .prompt-output.active { display: block; }
    .prompt-output textarea {
      width: 100%; min-height: 200px; padding: 16px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg); color: var(--text);
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 0.82rem; line-height: 1.7; resize: vertical;
    }
    .prompt-output textarea:focus { outline: none; border-color: var(--accent-1); }
    .prompt-actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .btn {
      padding: 10px 24px; border: none; border-radius: 8px;
      font-size: 0.9rem; font-weight: 500; cursor: pointer;
      transition: all var(--transition); font-family: inherit;
    }
    .btn-primary { background: var(--accent-1); color: #fff; }
    .btn-primary:hover { background: #b56a4e; }
    .btn-copy { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
    .btn-copy:hover { border-color: var(--accent-1); color: var(--accent-1); }
    .btn-copy.copied { border-color: #4caf50; color: #4caf50; }

    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--text); color: var(--bg); padding: 10px 24px; border-radius: 8px;
      font-size: 0.85rem; opacity: 0; transition: all 0.4s ease;
      pointer-events: none; z-index: 9999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">CXY</a>
      <ul class="nav-links">
        <li><a href="/">首页</a></li>
        <li><a href="/photography/">摄影</a></li>
        <li><a href="/ai-skills/">AI 技能</a></li>
        <li><button id="themeToggle" class="theme-toggle" aria-label="切换主题">☀️</button></li>
      </ul>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <p class="hero-subtitle reveal">AI Skills</p>
      <h1 class="reveal">AI 作图技能</h1>
      <p class="reveal">收集、拆解、分享 AI 图像生成的技巧与工作流。</p>
    </div>
  </header>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="skills-grid" id="skillsContainer"></div>

      <div class="skill-detail" id="skillDetail">
        <div class="skill-detail-banner" id="detailBanner"></div>
        <div class="skill-detail-body">
          <div class="skill-detail-header">
            <div>
              <h2 id="detailTitle"></h2>
              <div class="skill-card-tags" id="detailTags" style="margin-top:8px;"></div>
            </div>
            <button class="close-btn" id="closeDetail">✕</button>
          </div>
          <p class="skill-detail-desc" id="detailDesc"></p>

          <form class="prompt-form" id="promptForm">
            <div id="formFields"></div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem;">✨ 生成 Prompt</button>
          </form>

          <div class="prompt-output" id="promptOutput">
            <label style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:8px;">生成的 Prompt</label>
            <textarea id="promptResult" readonly></textarea>
            <div class="prompt-actions">
              <button class="btn btn-copy" id="copyBtn">📋 复制</button>
              <button class="btn btn-primary" id="regenerateBtn">🔄 重新生成</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <footer class="footer">
    <div class="container"><p>&copy; 2026 CXY · 用光影与代码书写</p></div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    // =============================================
    // Skills Data
    // =============================================
    const skills = [
      {
        id: 'zine-poster',
        title: 'GC Minimal Zine Poster',
        desc: '将主题、句子、物件、情绪或文章构想，转化为一张安静、极简的 ZINE 风格海报提示词。3:5 仿旧纸张画布，大量留白，一个小型视觉主体，一颗高饱和度色彩锚点。',
        tags: ['ZINE 风格', '极简海报', '纸张质感', '留白构图'],
        img: 'night-door.jpeg',
        banner: 'yellow-step.jpeg'
      },
      {
        id: 'gathered-scenes',
        title: '实景拼贴 · Gathered Scenes',
        desc: '保留照片中不可替代的现场关系，以真实摄影作为锚点，让源自原图的抽象形状、单一高纯度色彩与可见的手撕纤维边缘向纸面延伸。照片提供事实，创作决定如何留下它。',
        tags: ['实景拼贴', '摄影锚点', '纸张质感', '手撕边界'],
        img: 'gathered-scene-1.jpg',
        banner: 'gathered-scene-2.jpg'
      },
      {
        id: 'scene-distillation',
        title: '影像蒸馏 · Scene Distillation',
        desc: '不在成品中保留原始照片。从照片中提取语义核心、情绪张力和视觉隐喻，再用纸张、插画、色彩与自由文字创作一件全新的作品。表达优先，克制而有力。',
        tags: ['影像蒸馏', '情绪叙事', '自由创作', '视觉隐喻'],
        img: 'distillation-1.jpg',
        banner: 'distillation-2.jpg'
      },
      {
        id: 'photo-abstract-editorial',
        title: '抽象编辑 · Photo Abstract Editorial',
        desc: '保留照片原片作为上方摄影区域，在下方创建仅从照片空间关系、色彩和节奏推导出的极简抽象记忆面板，搭配诗意英文标题。干净、竖向、编辑感。',
        tags: ['摄影保留', '抽象面板', '编辑风格', '极简'],
        img: 'abstract-editorial-1.jpg',
        banner: 'abstract-editorial-card.jpg'
      }
    ];

    // =============================================
    // Shared Data
    // =============================================
    const COLORS = [
      { id: 'cobalt-blue', label: '钴蓝', hex: '#0047ab' },
      { id: 'ultramarine', label: '群青', hex: '#120a8f' },
      { id: 'cyan', label: '青色', hex: '#00bcd4' },
      { id: 'violet', label: '紫罗兰', hex: '#8b5cf6' },
      { id: 'magenta-pink', label: '品红', hex: '#e91e8a' },
      { id: 'lemon-yellow', label: '柠檬黄', hex: '#fff44f' },
      { id: 'pear-green', label: '梨绿', hex: '#a8d84f' },
      { id: 'orange', label: '橙色', hex: '#ff6b35' },
      { id: 'tomato-red', label: '番茄红', hex: '#e63946' }
    ];

    const PAPERS = [
      { id: 'warm-cream', label: '暖白' }, { id: 'cool-gray', label: '冷灰' },
      { id: 'ivory', label: '象牙白' }, { id: 'beige', label: '米色' },
      { id: 'light-ochre', label: '浅赭' }, { id: 'faded-newsprint', label: '新闻纸' }
    ];

    const MOODS = [
      { id: 'quiet', label: '🤍 安静' }, { id: 'summer', label: '☀️ 夏日' },
      { id: 'solitude', label: '🌿 孤独' }, { id: 'childhood', label: '🍭 童年' },
      { id: 'seaside', label: '🌊 海边' }, { id: 'afternoon', label: '🌤️ 午后' },
      { id: 'night', label: '🌙 夜晚' }, { id: 'memory', label: '📜 记忆' },
      { id: 'slight-surrealism', label: '🌀 超现实' }
    ];

    const TENSIONS = [
      { id: 'intimacy-distance', label: '亲密 / 距离', icon: '↔️' },
      { id: 'shelter-confinement', label: '庇护 / 束缚', icon: '🏠' },
      { id: 'movement-stillness', label: '运动 / 静止', icon: '⚡' },
      { id: 'smallness-vastness', label: '渺小 / 广阔', icon: '⛰️' },
      { id: 'warmth-coldness', label: '温暖 / 寒冷', icon: '🌡️' },
      { id: 'memory-disappearance', label: '记忆 / 消逝', icon: '🕯️' },
      { id: 'order-growth', label: '秩序 / 生长', icon: '🌱' },
      { id: 'visibility-concealment', label: '可见 / 隐藏', icon: '👁️' },
      { id: 'permanence-fragility', label: '永恒 / 脆弱', icon: '🪨' }
    ];

    const COLOR_MAP = {
      'cobalt-blue': 'fully saturated cobalt-blue', 'ultramarine': 'opaque ultramarine',
      'cyan': 'vivid cyan', 'violet': 'deep violet', 'magenta-pink': 'bright magenta-pink',
      'lemon-yellow': 'pure lemon-yellow', 'pear-green': 'vivid pear-green',
      'orange': 'warm saturated orange', 'tomato-red': 'clean tomato-red'
    };
    const PAPER_MAP = {
      'warm-cream': 'warm cream aged paper', 'cool-gray': 'cool gray aged paper',
      'ivory': 'ivory-toned vintage paper', 'beige': 'beige antique paper',
      'light-ochre': 'light ochre aged paper', 'faded-newsprint': 'faded newsprint paper'
    };

    // =============================================
    // Form Builders
    // =============================================
    function buildColorSwatches(containerId, stateKey, defaultVal) {
      const c = document.getElementById(containerId);
      COLORS.forEach(clr => {
        const el = document.createElement('div');
        el.className = `color-swatch${clr.id === defaultVal ? ' selected' : ''}`;
        el.style.background = clr.hex;
        if (clr.id === 'lemon-yellow') el.style.border = '2px solid #ddd';
        el.innerHTML = `<span class="tooltip">${clr.label}</span>`;
        el.dataset.value = clr.id;
        el.addEventListener('click', () => {
          c.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
          el.classList.add('selected');
          window[stateKey] = clr.id;
        });
        c.appendChild(el);
      });
    }

    function buildChips(containerId, items, stateKey, defaultVal) {
      const c = document.getElementById(containerId);
      items.forEach(item => {
        const el = document.createElement('div');
        const id = item.id || item;
        el.className = `chip-option${id === defaultVal ? ' selected' : ''}`;
        el.textContent = item.label || item;
        el.dataset.value = id;
        el.addEventListener('click', () => {
          c.querySelectorAll('.chip-option').forEach(s => s.classList.remove('selected'));
          el.classList.add('selected');
          window[stateKey] = id;
        });
        c.appendChild(el);
      });
    }

    function buildTensionGrid(containerId, items, stateKey, defaultVal) {
      const c = document.getElementById(containerId);
      items.forEach(item => {
        const el = document.createElement('div');
        el.className = `tension-option${item.id === defaultVal ? ' selected' : ''}`;
        el.innerHTML = `<span class="icon">${item.icon}</span><div class="label">${item.label}</div>`;
        el.dataset.value = item.id;
        el.addEventListener('click', () => {
          c.querySelectorAll('.tension-option').forEach(s => s.classList.remove('selected'));
          el.classList.add('selected');
          window[stateKey] = item.id;
        });
        c.appendChild(el);
      });
    }

    // =============================================
    // Skill-Specific Form Definitions
    // =============================================
    const FORM_DEFS = {
      'zine-poster': {
        state: { color: 'orange', paper: 'warm-cream', layout: 'dual-panel', anchor: 'flat-silhouette', texture: 'risograph-grain', mood: 'quiet' },
        html: function() {
          return `
            <div><div class="form-section-label">内容</div>
              <div class="form-group full"><label>主题 / 主体 <span class="hint">— 海报的核心内容</span></label>
                <input type="text" id="fSubject" placeholder="例如：雨天的旧书店、海边黄昏、一只旧皮箱..." required></div>
              <div class="form-group full" style="margin-top:16px;"><label>海报文字 <span class="hint">— 可选</span></label>
                <input type="text" id="fText" placeholder="留空则自动生成"></div>
            </div>
            <div><div class="form-section-label">色彩</div>
              <div class="form-group"><label>强调色</label><div class="color-swatches" id="zp-color"></div></div>
              <div class="form-group" style="margin-top:16px;"><label>纸张色调</label><div class="chip-grid" id="zp-paper"></div></div>
            </div>
            <div><div class="form-section-label">布局</div>
              <div class="form-group"><label>布局风格</label><div class="layout-grid" id="zp-layout"></div></div>
            </div>
            <div><div class="form-section-label">风格</div>
              <div class="form-row"><div class="form-group"><label>图像锚点</label><div class="anchor-grid" id="zp-anchor"></div></div>
                <div class="form-group"><label>纹理质感</label><div class="chip-grid" id="zp-texture"></div></div>
              </div>
              <div class="form-group full" style="margin-top:16px;"><label>情绪氛围</label><div class="chip-grid" id="zp-mood"></div></div>
            </div>`;
        },
        init: function() {
          buildColorSwatches('zp-color', '_zpColor', 'orange');
          buildChips('zp-paper', PAPERS, '_zpPaper', 'warm-cream');
          buildChips('zp-texture', [
            { id: 'xerox-softness', label: '复印柔化' }, { id: 'risograph-grain', label: '孔版印刷颗粒' },
            { id: 'letterpress-ink-bleed', label: '凸版油墨晕染' }, { id: 'halftone-degradation', label: '网点退化' },
            { id: 'film-grain', label: '胶片颗粒' }, { id: 'scan-noise', label: '扫描噪点' },
            { id: 'aged-paper-mottling', label: '仿旧纸张斑驳' }
          ], '_zpTexture', 'risograph-grain');
          buildChips('zp-mood', MOODS, '_zpMood', 'quiet');
          // Layout
          const layouts = [
            { id: 'center-fragment', label: '居中碎片' }, { id: 'lower-left-float', label: '左下浮动' },
            { id: 'upper-right-block', label: '右上区块' }, { id: 'dual-panel', label: '双面板' },
            { id: 'irregular-cutout', label: '不规则剪裁' }, { id: 'type-led', label: '文字主导' },
            { id: 'single-specimen', label: '单一标本' }
          ];
          const diags = {
            'center-fragment': [{x:38,y:35,w:24,h:30}],
            'lower-left-float': [{x:5,y:55,w:28,h:35}],
            'upper-right-block': [{x:55,y:5,w:30,h:25}],
            'dual-panel': [{x:10,y:20,w:35,h:25},{x:50,y:50,w:35,h:25}],
            'irregular-cutout': [{x:20,y:25,w:40,h:45,clip:true}],

          return [
            `Expression and visible consequence: ${propLine} The central tension is ${tensionStr}. ${metaLine} Leave one interpretive opening — one relationship deliberately unresolved — so the viewer must complete the meaning.`,
            `Canvas: a vertical 3:5 paper-poster on ${paper}. Full-frame flat scan, no border, no mockup. 70-85% quiet paper. One active illustration cluster occupying about 12-30% of the canvas. Asymmetric composition with figure-ground clarity, directional breathing room, and deliberate eye path: entry through the focal encounter, then movement through negative space to quiet exit.`,
            `Distilled subject: ${scene ? `semantic nucleus extracted from the described scene: "${scene}".` : 'semantic nucleus extracted from the supplied reference photograph.'} Preserve 2-4 source anchors — the core subject, dominant gesture, key spatial relationship, and emotional residue. Discard roughly 70-90% of descriptive detail. Render the illustration using editorial abstraction: simplified masses, broken contours, cut-paper forms, and sparse marks. The final image must contain original illustration, paper, and typography only. Do not reproduce, embed, or retain photographic pixels from the reference.`,
            `${colorSection}\n\nTransition edge: use natural isolated contour — clean organic silhouettes that meet the paper directly, with faint ink bite or paper grain at the contour. No torn boundary, grayscale rim, or decorative border.\n\nTypography: ${textLine} Treat text as authorial material — it may be tiny, fragmented, oversized, or materially integrated. Use it to expand, redirect, or complicate the image, not to caption what is visible.`,
            `Reproduction: flat orthographic scanned-paper appearance. Matte absorbent paper, diffuse light, low-to-medium contrast. Paper fibers, grain, and subtle print defects. The emotional temperature is ${moodMap}: poetic, tactile, and non-commercial. No photographic or photorealistic regions. No 3D, no cinematic lighting, no glossy mockup, no commercial hierarchy, no dense detail, no decorative motifs. The result must stand as an independent artwork without the source photograph.`
          ].join('\n\n');
        }
      },

      'photo-abstract-editorial': {
        html: function() {
          return `
            <style>
              .split-diagram {
                width: 100%; aspect-ratio: 3/5; background: var(--border); border-radius: 4px;
                position: relative; overflow: hidden; margin-bottom: 6px;
              }
              .split-diagram .photo-area {
                position: absolute; left: 0; right: 0; background: #8a9ba8; opacity: 0.7;
                border-bottom: 1px dashed rgba(0,0,0,0.15);
              }
              .split-diagram .panel-area {
                position: absolute; left: 0; right: 0; background: #f3f0e8; opacity: 0.9;
              }
              .split-diagram .label-overlay {
                position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
                font-size: 0.55rem; color: #666; font-weight: 600; text-align: center;
                line-height: 1.3; pointer-events: none;
              }
              .orient-grid {
                display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
              }
              .orient-option {
                cursor: pointer; border: 2px solid var(--border); border-radius: 10px;
                padding: 10px 8px 8px; text-align: center;
                transition: all var(--transition); background: var(--bg);
              }
              .orient-option:hover { border-color: var(--text-muted); }
              .orient-option.selected { border-color: var(--accent-1); background: var(--bg-card); }
              .orient-option .label { font-size: 0.65rem; color: var(--text-muted); line-height: 1.2; margin-top: 4px; }
              .orient-option.selected .label { color: var(--text); font-weight: 600; }

              .orient-section { overflow: hidden; transition: all 0.4s ease; }
              .orient-section.collapsed { display: none; }
              .orient-section.expanded { display: block; }
              .chip-grid + .chip-hint { margin-top: 6px; }
            </style>
            <div><div class="form-section-label">模式</div>
              <div class="form-group full"><label>是否拼接原图 <span class="hint">— 选择是否将照片与抽象面板拼接</span></label>
                <div class="chip-grid" id="ae-mode"></div>
                <div class="chip-hint" id="ae-mode-hint" style="font-size:0.75rem;color:var(--text-muted);margin-top:8px;">拼接：照片 + 抽象面板 &nbsp;·&nbsp; 仅抽象面板：不包含照片</div></div>
            </div>
            <div class="orient-section expanded" id="ae-orient-section">
              <div><div class="form-section-label">构图</div>
                <div class="form-group"><label>照片方向 <span class="hint">— 决定照片与面板的分配比例</span></label>
                  <div class="orient-grid" id="ae-orientation"></div></div>
              </div>
            </div>
            <div><div class="form-section-label">内容</div>
              <div class="form-group full"><label>照片描述 <span class="hint">— 可选</span></label>
                <textarea id="aeScene" placeholder="可选。描述照片中的主体、空间关系、光线和情绪"></textarea></div>
              <div class="form-row" style="margin-top:16px;">
                <div class="form-group"><label>抽象标记风格</label>
                  <div class="chip-grid" id="ae-style"></div></div>
                <div class="form-group"><label>色彩倾向</label>
                  <div class="chip-grid" id="ae-palette"></div></div>
              </div>
            </div>
            <div><div class="form-section-label">文字</div>
              <div class="form-group full"><label>文字 <span class="hint">— 选择是否包含标题文字</span></label>
                <div class="chip-grid" id="ae-text-toggle"></div></div>
              <div id="ae-text-fields" style="transition:opacity 0.3s ease;">
              <div class="form-row">
                <div class="form-group"><label>标题 <span class="hint">— 可选，留空自动生成</span></label>
                  <input type="text" id="aeTitle" placeholder="留空则自动生成英文标题"></div>
                <div class="form-group"><label>副标题 <span class="hint">— 可选</span></label>
                  <input type="text" id="aeSubtitle" placeholder="留空则无副标题"></div>
              </div>
              </div>
            </div>`;
        },
        init: function() {
          // Mode toggle
          buildChips('ae-mode', [
            { id: 'diptych', label: '拼接' },
            { id: 'abstract-only', label: '仅抽象面板' }
          ], '_aeMode', 'diptych');

          // Orientation diagrams
          const orients = [
            { id: 'landscape', label: '横向', photoPct: 45, panelPct: 55, desc: '风景/水平延展' },
            { id: 'portrait', label: '纵向', photoPct: 62, panelPct: 38, desc: '建筑/人物' },
            { id: 'square', label: '均衡', photoPct: 53, panelPct: 47, desc: '接近方形' }
          ];
          const oc = document.getElementById('ae-orientation');
          orients.forEach(o => {
            const el = document.createElement('div');
            el.className = `orient-option${o.id === 'landscape' ? ' selected' : ''}`;
            el.innerHTML = `
              <div class="split-diagram">
                <div class="photo-area" style="top:0;height:${o.photoPct}%"></div>
                <div class="panel-area" style="top:${o.photoPct}%;height:${o.panelPct}%"></div>
                <div class="label-overlay">📷 ${o.photoPct}%<br>▫️ ${o.panelPct}%</div>
              </div>
              <div class="label">${o.label}<br><span style="font-size:0.6rem;color:var(--text-muted)">${o.desc}</span></div>`;
            el.dataset.value = o.id;
            el.addEventListener('click', () => {
              oc.querySelectorAll('.orient-option').forEach(s => s.classList.remove('selected'));
              el.classList.add('selected');
              window._aeOrient = o.id;
            });
            oc.appendChild(el);
          });

          buildChips('ae-style', [
            { id: 'color-blocks', label: '色块' },
            { id: 'soft-organic', label: '柔和有机' },
            { id: 'arcing-strokes', label: '弧形笔触' },
            { id: 'stacked-bands', label: '层叠色带' },
            { id: 'architectural', label: '建筑质感' }
          ], '_aeStyle', 'color-blocks');

          buildChips('ae-palette', [
            { id: 'warm', label: '暖调' }, { id: 'cool', label: '冷调' },
            { id: 'neutral', label: '中性' }, { id: 'from-photo', label: '从照片提取' }
          ], '_aePalette', 'from-photo');

          // Toggle orientation section visibility
          const modeVal = window._aeMode || 'diptych';
          toggleOrientSection(modeVal);

          // Override chip click for mode to toggle orientation section
          document.querySelectorAll('#ae-mode .chip-option').forEach(chip => {
            const orig = chip._listeners ? true : false;
            chip.addEventListener('click', function() {
              setTimeout(() => toggleOrientSection(window._aeMode), 10);
            });
          });

          buildChips('ae-text-toggle', [
            { id: 'with-text', label: '包含文字' },
            { id: 'no-text', label: '不要文字' }
          ], '_aeTextMode', 'with-text');

          function toggleTextFields(val) {
            const el = document.getElementById('ae-text-fields');
            if (!el) return;
            el.style.opacity = val === 'no-text' ? '0.3' : '1';
            el.querySelectorAll('input').forEach(inp => inp.disabled = val === 'no-text');
          }
          toggleTextFields(window._aeTextMode || 'with-text');
          document.querySelectorAll('#ae-text-toggle .chip-option').forEach(chip => {
            chip.addEventListener('click', function() {
              setTimeout(() => toggleTextFields(window._aeTextMode), 10);
            });
          });

          window._aeOrient = 'landscape'; window._aeStyle = 'color-blocks';
          window._aePalette = 'from-photo'; window._aeMode = 'diptych';
        },
        generate: function() {
          const scene = document.getElementById('aeScene').value.trim();
          const title = document.getElementById('aeTitle').value.trim();
          const subtitle = document.getElementById('aeSubtitle').value.trim();
          const mode = window._aeMode || 'diptych';
          const orient = window._aeOrient || 'landscape';
          const style = window._aeStyle || 'color-blocks';
          const palette = window._aePalette || 'from-photo';
          const textMode = window._aeTextMode || 'with-text';

          const orientMap = {
            'landscape': 'photo area about 38-52% of the final height; abstract panel about 48-62%',
            'portrait': 'photo area about 55-68% of the final height; abstract panel about 32-45%',
            'square': 'photo area about 48-58% of the final height; abstract panel about 42-52%'
          };

          const styleMap = {
            'color-blocks': 'flat or slightly organic color blocks',
            'soft-organic': 'soft circular or irregular organic masses',
            'arcing-strokes': 'arcing or tapered brush-like strokes',
            'stacked-bands': 'continuous short bars or stacked color bands',
            'architectural': 'simplified architectural masses with restrained geometric clarity'
          };

          const paletteMap = {
            'warm': 'a warm-toned palette with restrained ochre, terracotta, and muted amber',
            'cool': 'a cool-toned palette with restrained slate blue, sage, and muted gray',
            'neutral': 'a restrained neutral palette of warm grays, charcoal, and ivory',
            'from-photo': 'colors extracted from the source photograph, lowered in saturation and reduced in number'
          };

          const titleLine = title
            ? `Use the exact title: "${title}"${subtitle ? ` with subtitle: "${subtitle}"` : '. No subtitle.'}`
            : `Create one original English title of 2-5 words grounded in visual facts${subtitle ? `, with subtitle: "${subtitle}"` : '. No subtitle.'}`;

          const sceneLine = scene
            ? `The photo depicts: "${scene}".`
            : 'The photo is the sole content source.';

          const noTextLine = 'Output limits: Output only one finished image. Absolutely no text, no title, no typography, no subtitle, no numbers, no signatures, no watermarks. No photo redrawing, no filters, no style transfer, no vector tracing, no decorative elements, no generic icons. The result must be clean, editorial, and non-commercial.';

          if (mode === 'abstract-only') {
            const lines = [
              `Roles: The uploaded image is the sole content source. ${sceneLine} Do NOT include the original photograph in the output. Create only the abstract memory panel derived from the photo's spatial relationships, color hierarchy, and compositional rhythm.`,
              `Canvas: A vertical composition on a continuous neutral ivory background (#F3F0E8). No gradients, grain, texture, or lighting variation. The abstract motif occupies about 30-42% of the panel width and no more than 28-34% of the height, placed in the lower-center or asymmetrically. Keep 65-80% clean white space.`,
              `Abstraction: Use one primary mark family: ${styleMap[style] || styleMap['color-blocks']}. At most two supporting families. Preserve the minimum necessary recognizability — relationships first, contours discarded. Make the abstraction read first as a minimal abstract composition that only on second glance evokes this particular photo.`,
              `Color: ${paletteMap[palette] || paletteMap['from-photo']}. Use one dominant role, one dark structural role, one light/neutral role, and at most one or two small accent colors from the photo.`
            ];
            if (textMode !== 'no-text') {
              const titleLine = title
                ? `Use the exact title: "${title}"${subtitle ? ` with subtitle: "${subtitle}"` : '. No subtitle.'}`
                : `Create one original English title of 2-5 words grounded in visual facts${subtitle ? `, with subtitle: "${subtitle}"` : '. No subtitle.'}`;
              lines.push(`Typography: ${titleLine} Set the title on the panel below or beside the motif. Elegant restrained editorial serif. Dark restrained color from the photo — deep blue-gray, dark green, wine red, or charcoal.`);
              lines.push('Output limits: Only one finished image. Apart from the final title, absolutely no text, numbers, dates, signatures, logos, or watermarks. No photo, no photo redrawing, no filters, no style transfer, no decorative elements. Clean, editorial, non-commercial.');
            } else {
              lines.push(noTextLine);
            }
            return lines.join('\n\n');
          }

          const lines = [
            `Roles: The uploaded image is the sole content source. ${sceneLine} Faithfully present the photograph in the upper region. Do not redraw, replace, extend, retouch, or change the photo's content. Use the photo's subject relationships, spatial axes, intervals, rhythm, color hierarchy, and negative space to construct the abstract panel.`,
            `Composition: Create a vertical editorial diptych. ${orientMap[orient] || orientMap.landscape}. Join the photo and abstract panel directly with no frame, shadow, mockup, or collage effect. The abstract panel background is a completely even, continuous, neutral ivory (#F3F0E8). No gradients, grain, texture, or lighting variation on the panel.`,
            `Abstraction: Use one primary mark family: ${styleMap[style] || styleMap['color-blocks']}. At most two supporting families from fine lines, short vertical bars, restrained human marks, or repeated rhythm. Preserve the minimum necessary recognizability rather than replicating objects. Default to relationships first, contours discarded. Make the abstraction read first as a minimal abstract composition and only on second glance evoke this particular photo.`,
            `Color: ${paletteMap[palette] || paletteMap['from-photo']}. Use one dominant color role, one dark structural role, one light/neutral role, and at most one or two small accent colors. Accent colors must come from the photo. Do not introduce neon, unsupported complements, or competing accents.`
          ];
          if (textMode !== 'no-text') {
            const titleLine = title
              ? `Use the exact title: "${title}"${subtitle ? ` with subtitle: "${subtitle}"` : '. No subtitle.'}`
              : `Create one original English title of 2-5 words grounded in visual facts${subtitle ? `, with subtitle: "${subtitle}"` : '. No subtitle.'}`;
            lines.push(`Typography: ${titleLine} Set the title on the abstract panel only, below or beside the motif. Use an elegant restrained editorial serif. Choose a dark restrained color from the photo — deep blue-gray, dark green, wine red, or charcoal. Never use pure black or the brightest accent.`);
            lines.push('Output limits: Output only one finished image. Apart from the final title, absolutely no text, numbers, dates, signatures, logos, or watermarks. No photo redrawing, no filters, no style transfer, no vector tracing, no decorative elements, no generic icons. The result must be clean, editorial, and non-commercial.');
          } else {
            lines.push(noTextLine);
          }
          return lines.join('\n\n');
        }
      }
    };

    // =============================================
    // UI Logic
    // =============================================
    const container = document.getElementById('skillsContainer');
    const detail = document.getElementById('skillDetail');
    const closeBtn = document.getElementById('closeDetail');
    const form = document.getElementById('promptForm');
    const formFields = document.getElementById('formFields');
    const output = document.getElementById('promptOutput');
    const result = document.getElementById('promptResult');
    const copyBtn = document.getElementById('copyBtn');
    const regenBtn = document.getElementById('regenerateBtn');
    const toast = document.getElementById('toast');
    let currentSkill = null;

    // Render skill cards
    skills.forEach(skill => {
      const card = document.createElement('div');
      card.className = 'skill-card reveal';
      card.style.cursor = 'pointer';
      card.innerHTML = `
        <div class="skill-card-img">
          <img src="/ai-skills/examples/${skill.img}" alt="${skill.title}" loading="lazy">
        </div>
        <div class="skill-card-body">
          <div class="skill-card-tags">
            ${skill.tags.map(t => `<span>${t}</span>`).join('')}
            <span style="background:var(--accent-1);color:#fff;">可交互</span>
          </div>
          <h3>${skill.title}</h3>
          <p>${skill.desc}</p>
          <span class="card-link">试试生成 →</span>
        </div>
      `;
      card.addEventListener('click', () => openSkill(skill));
      container.appendChild(card);
    });

    function openSkill(skill) {
      currentSkill = skill.id;
      document.getElementById('detailTitle').textContent = skill.title;
      document.getElementById('detailTags').innerHTML = skill.tags.map(t => `<span>${t}</span>`).join('');
      document.getElementById('detailDesc').textContent = skill.desc;
      document.getElementById('detailBanner').innerHTML = skill.banner
        ? `<img src="/ai-skills/examples/${skill.banner}" alt="${skill.title}">` : '';

      // Render form
      const def = FORM_DEFS[skill.id];
      formFields.innerHTML = def.html();
      if (def.init) def.init();

      output.classList.remove('active');
      detail.classList.add('active');
      detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    closeBtn.addEventListener('click', () => {
      detail.classList.remove('active');
      output.classList.remove('active');
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!currentSkill) return;
      const def = FORM_DEFS[currentSkill];
      if (!def) return;
      const prompt = def.generate();
      if (!prompt) {
        showToast('请填写必填字段');
        return;
      }
      result.value = prompt;
      output.classList.add('active');
      copyBtn.textContent = '📋 复制';
      copyBtn.classList.remove('copied');
      result.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    regenBtn.addEventListener('click', () => form.dispatchEvent(new Event('submit')));

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(result.value);
        copyBtn.textContent = '✅ 已复制';
        copyBtn.classList.add('copied');
        showToast('Prompt 已复制到剪贴板');
      } catch {
        result.select();
        document.execCommand('copy');
        copyBtn.textContent = '✅ 已复制';
        copyBtn.classList.add('copied');
      }
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    window.toggleOrientSection = function(mode) {
      const section = document.getElementById('ae-orient-section');
      if (!section) return;
      section.classList.toggle('collapsed', mode !== 'diptych');
      section.classList.toggle('expanded', mode === 'diptych');
    };
  </script>
</body>
</html>
