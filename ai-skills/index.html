<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CXY 的 AI 作图技能收集">
  <title>AI 技能 · CXY</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <style>
    /* ============ Skill Card with Image ============ */
    .skill-card { padding: 0; overflow: hidden; }
    .skill-card-img {
      width: 100%;
      aspect-ratio: 3/4;
      overflow: hidden;
      background: var(--border);
    }
    .skill-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }
    .skill-card:hover .skill-card-img img { transform: scale(1.05); }
    .skill-card-body { padding: 24px 28px 28px; }
    .skill-card-body .card-link { margin-top: 0.5rem; }

    /* ============ Skill Detail ============ */
    .skill-detail {
      display: none;
      margin-top: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .skill-detail.active { display: block; }

    .skill-detail-banner {
      width: 100%;
      aspect-ratio: 3/1;
      overflow: hidden;
      background: var(--border);
    }
    .skill-detail-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .skill-detail-body { padding: 32px 40px 40px; }
    @media (max-width: 640px) { .skill-detail-body { padding: 20px 24px 24px; } }

    .skill-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .skill-detail-header h2 { font-size: 1.5rem; }
    .skill-detail-header .close-btn {
      background: none; border: 1px solid var(--border); border-radius: 50%;
      width: 32px; height: 32px; cursor: pointer; font-size: 1.1rem;
      color: var(--text-muted); transition: all var(--transition); flex-shrink: 0;
    }
    .skill-detail-header .close-btn:hover { color: var(--text); border-color: var(--text-muted); }

    .skill-detail-desc {
      color: var(--text-muted); font-size: 0.95rem;
      margin-bottom: 2rem; line-height: 1.7;
    }

    /* ============ Visual Form ============ */
    .prompt-form { display: grid; gap: 28px; }

    .form-section-label {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--text-muted); font-weight: 600;
      border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px;
    }

    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label {
      font-size: 0.85rem; font-weight: 600; color: var(--text);
    }
    .form-group label .hint {
      font-weight: 400; color: var(--text-muted); font-size: 0.78rem;
    }
    .form-group input, .form-group textarea {
      padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font-size: 0.9rem;
      font-family: inherit; transition: border-color var(--transition);
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none; border-color: var(--accent-1);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group.full { grid-column: 1 / -1; }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }

    /* ============ Color Swatches ============ */
    .color-swatches {
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .color-swatch {
      width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; border: 3px solid transparent;
      transition: all var(--transition); position: relative;
      flex-shrink: 0;
    }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.selected {
      border-color: var(--text);
      box-shadow: 0 0 0 2px var(--bg-card);
    }
    .color-swatch .tooltip {
      position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%);
      font-size: 0.65rem; color: var(--text-muted); white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .color-swatch:hover .tooltip { opacity: 1; }

    /* ============ Layout Selector ============ */
    .layout-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }
    .layout-option {
      cursor: pointer; border: 2px solid var(--border); border-radius: 10px;
      padding: 10px 8px 8px; text-align: center;
      transition: all var(--transition); background: var(--bg);
    }
    .layout-option:hover { border-color: var(--text-muted); }
    .layout-option.selected { border-color: var(--accent-1); background: var(--bg-card); }

    .layout-diagram {
      width: 100%; aspect-ratio: 3/4;
      background: var(--border); border-radius: 4px; margin-bottom: 6px;
      position: relative; overflow: hidden;
    }
    .layout-diagram .dot {
      position: absolute; border-radius: 2px;
      background: var(--accent-1); opacity: 0.8;
    }
    .layout-diagram .dot.color-block { opacity: 0.5; }
    .layout-diagram .line {
      position: absolute; height: 1px; background: var(--text-muted); opacity: 0.5;
    }

    .layout-option .label {
      font-size: 0.7rem; color: var(--text-muted); line-height: 1.2;
    }
    .layout-option.selected .label { color: var(--text); font-weight: 600; }

    /* ============ Anchor Selector ============ */
    .anchor-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 8px;
    }
    .anchor-option {
      cursor: pointer; border: 2px solid var(--border); border-radius: 10px;
      padding: 12px 8px; text-align: center;
      transition: all var(--transition); background: var(--bg);
    }
    .anchor-option:hover { border-color: var(--text-muted); }
    .anchor-option.selected { border-color: var(--accent-1); background: var(--bg-card); }
    .anchor-option .icon { font-size: 1.5rem; display: block; margin-bottom: 4px; }
    .anchor-option .label { font-size: 0.65rem; color: var(--text-muted); line-height: 1.2; }
    .anchor-option.selected .label { color: var(--text); font-weight: 600; }

    /* ============ Mood / Texture / Paper Selector ============ */
    .chip-grid {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .chip-option {
      cursor: pointer; border: 2px solid var(--border); border-radius: 20px;
      padding: 7px 16px; font-size: 0.82rem; color: var(--text-muted);
      transition: all var(--transition); background: var(--bg);
    }
    .chip-option:hover { border-color: var(--text-muted); color: var(--text); }
    .chip-option.selected {
      border-color: var(--accent-1); background: var(--bg-card); color: var(--text); font-weight: 600;
    }

    /* ============ Prompt Output ============ */
    .prompt-output { display: none; margin-top: 28px; }
    .prompt-output.active { display: block; }

    .prompt-output textarea {
      width: 100%; min-height: 200px; padding: 16px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg); color: var(--text);
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 0.82rem; line-height: 1.7; resize: vertical;
    }
    .prompt-output textarea:focus { outline: none; border-color: var(--accent-1); }

    .prompt-actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

    .btn {
      padding: 10px 24px; border: none; border-radius: 8px;
      font-size: 0.9rem; font-weight: 500; cursor: pointer;
      transition: all var(--transition); font-family: inherit;
    }
    .btn-primary { background: var(--accent-1); color: #fff; }
    .btn-primary:hover { background: #b56a4e; }
    .btn-copy {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    }
    .btn-copy:hover { border-color: var(--accent-1); color: var(--accent-1); }
    .btn-copy.copied { border-color: #4caf50; color: #4caf50; }

    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--text); color: var(--bg); padding: 10px 24px; border-radius: 8px;
      font-size: 0.85rem; opacity: 0; transition: all 0.4s ease;
      pointer-events: none; z-index: 9999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">CXY</a>
      <ul class="nav-links">
        <li><a href="/">首页</a></li>
        <li><a href="/photography/">摄影</a></li>
        <li><a href="/ai-skills/">AI 技能</a></li>
        <li><button id="themeToggle" class="theme-toggle" aria-label="切换主题">☀️</button></li>
      </ul>
    </div>
  </nav>

  <!-- Header -->
  <header class="page-header">
    <div class="container">
      <p class="hero-subtitle reveal">AI Skills</p>
      <h1 class="reveal">AI 作图技能</h1>
      <p class="reveal">收集、拆解、分享 AI 图像生成的技巧与工作流。</p>
    </div>
  </header>

  <!-- Skills Grid -->
  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="skills-grid" id="skillsContainer"></div>

      <!-- Skill Detail -->
      <div class="skill-detail" id="skillDetail">
        <div class="skill-detail-banner" id="detailBanner"></div>
        <div class="skill-detail-body">
          <div class="skill-detail-header">
            <div>
              <h2 id="detailTitle">GC Minimal Zine Poster</h2>
              <div class="skill-card-tags" id="detailTags" style="margin-top:8px;"></div>
            </div>
            <button class="close-btn" id="closeDetail">✕</button>
          </div>
          <p class="skill-detail-desc" id="detailDesc"></p>

          <form class="prompt-form" id="promptForm">

            <!-- 内容 -->
            <div>
              <div class="form-section-label">内容</div>
              <div class="form-group full">
                <label>主题 / 主体 <span class="hint">— 海报的核心内容</span></label>
                <input type="text" id="fSubject" placeholder="例如：雨天的旧书店、海边黄昏、一只旧皮箱..." required>
              </div>
              <div class="form-group full" style="margin-top:16px;">
                <label>海报文字 <span class="hint">— 可选，出现在海报上的短句</span></label>
                <input type="text" id="fText" placeholder="留空则自动生成">
              </div>
            </div>

            <!-- 色彩 -->
            <div>
              <div class="form-section-label">色彩</div>
              <div class="form-group">
                <label>强调色 <span class="hint">— 高饱和度色彩锚点</span></label>
                <div class="color-swatches" id="colorSwatches"></div>
              </div>
              <div class="form-group" style="margin-top:16px;">
                <label>纸张色调</label>
                <div class="chip-grid" id="paperChips"></div>
              </div>
            </div>

            <!-- 布局 -->
            <div>
              <div class="form-section-label">布局</div>
              <div class="form-group">
                <label>布局风格 <span class="hint">— 视觉构成与留白分布</span></label>
                <div class="layout-grid" id="layoutGrid"></div>
              </div>
            </div>

            <!-- 风格 -->
            <div>
              <div class="form-section-label">风格</div>
              <div class="form-row">
                <div class="form-group">
                  <label>图像锚点</label>
                  <div class="anchor-grid" id="anchorGrid"></div>
                </div>
                <div class="form-group">
                  <label>纹理质感</label>
                  <div class="chip-grid" id="textureChips"></div>
                </div>
              </div>
              <div class="form-group full" style="margin-top:16px;">
                <label>情绪氛围</label>
                <div class="chip-grid" id="moodChips"></div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem;">✨ 生成 Prompt</button>
          </form>

          <div class="prompt-output" id="promptOutput">
            <label style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:8px;">生成的 Prompt</label>
            <textarea id="promptResult" readonly></textarea>
            <div class="prompt-actions">
              <button class="btn btn-copy" id="copyBtn">📋 复制</button>
              <button class="btn btn-primary" id="regenerateBtn">🔄 重新生成</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container"><p>&copy; 2026 CXY · 用光影与代码书写</p></div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    // =============================================
    // Data
    // =============================================
    const skills = [{
      id: 'zine-poster',
      title: 'GC Minimal Zine Poster',
      desc: '将主题、句子、物件、情绪或文章构想，转化为一张安静、极简的 ZINE 风格海报提示词。3:5 仿旧纸张画布，大量留白，一个小型视觉主体，一颗高饱和度色彩锚点。',
      tags: ['ZINE 风格', '极简海报', '纸张质感', '留白构图'],
      examples: [
        'night-door.jpeg', 'yellow-step.jpeg', 'typhoon-memory.jpeg',
        'shore-pause.jpeg', 'moon-tide.jpeg', 'pause-map.jpeg'
      ]
    }];

    // Colors
    const colors = [
      { id: 'cobalt-blue', label: '钴蓝', hex: '#0047ab' },
      { id: 'ultramarine', label: '群青', hex: '#120a8f' },
      { id: 'cyan', label: '青色', hex: '#00bcd4' },
      { id: 'violet', label: '紫罗兰', hex: '#8b5cf6' },
      { id: 'magenta-pink', label: '品红', hex: '#e91e8a' },
      { id: 'lemon-yellow', label: '柠檬黄', hex: '#fff44f' },
      { id: 'pear-green', label: '梨绿', hex: '#a8d84f' },
      { id: 'orange', label: '橙色', hex: '#ff6b35' },
      { id: 'tomato-red', label: '番茄红', hex: '#e63946' }
    ];

    const papers = [
      { id: 'warm-cream', label: '暖白 Warm Cream' },
      { id: 'cool-gray', label: '冷灰 Cool Gray' },
      { id: 'ivory', label: '象牙白 Ivory' },
      { id: 'beige', label: '米色 Beige' },
      { id: 'light-ochre', label: '浅赭 Light Ochre' },
      { id: 'faded-newsprint', label: '褪色新闻纸 Newsprint' }
    ];

    const layouts = [
      { id: 'center-fragment', label: '居中碎片' },
      { id: 'lower-left-float', label: '左下浮动' },
      { id: 'upper-right-block', label: '右上区块' },
      { id: 'dual-panel', label: '双面板' },
      { id: 'irregular-cutout', label: '不规则剪裁' },
      { id: 'type-led', label: '文字主导' },
      { id: 'single-specimen', label: '单一标本' }
    ];

    const anchors = [
      { id: 'tiny-faded-photo', label: '褪色照片', icon: '🌫️' },
      { id: 'torn-paper-clipping', label: '撕纸剪报', icon: '✂️' },
      { id: 'flat-silhouette', label: '扁平剪影', icon: '◼️' },
      { id: 'solid-color-block', label: '纯色色块', icon: '🟧' },
      { id: 'old-printed-illustration', label: '旧印刷插图', icon: '🖨️' },
      { id: 'object-specimen', label: '物件标本', icon: '🔍' },
      { id: 'translucent-geometric', label: '半透明几何', icon: '◇' },
      { id: 'abstract-texture', label: '抽象纹理', icon: '〰️' }
    ];

    const textures = [
      { id: 'xerox-softness', label: '复印柔化' },
      { id: 'risograph-grain', label: '孔版印刷颗粒' },
      { id: 'letterpress-ink-bleed', label: '凸版油墨晕染' },
      { id: 'halftone-degradation', label: '网点退化' },
      { id: 'film-grain', label: '胶片颗粒' },
      { id: 'scan-noise', label: '扫描噪点' },
      { id: 'aged-paper-mottling', label: '仿旧纸张斑驳' }
    ];

    const moods = [
      { id: 'quiet', label: '🤍 安静' },
      { id: 'summer', label: '☀️ 夏日' },
      { id: 'solitude', label: '🌿 孤独' },
      { id: 'childhood', label: '🍭 童年' },
      { id: 'seaside', label: '🌊 海边' },
      { id: 'afternoon', label: '🌤️ 午后' },
      { id: 'night', label: '🌙 夜晚' },
      { id: 'memory', label: '📜 记忆' },
      { id: 'slight-surrealism', label: '🌀 超现实' }
    ];

    // =============================================
    // Prompt Generator
    // =============================================
    const COLOR_MAP = {
      'cobalt-blue': 'fully saturated cobalt-blue',
      'ultramarine': 'opaque ultramarine',
      'cyan': 'vivid cyan',
      'violet': 'deep violet',
      'magenta-pink': 'bright magenta-pink',
      'lemon-yellow': 'pure lemon-yellow',
      'pear-green': 'vivid pear-green',
      'orange': 'warm saturated orange',
      'tomato-red': 'clean tomato-red'
    };
    const PAPER_MAP = {
      'warm-cream': 'warm cream aged paper',
      'cool-gray': 'cool gray aged paper',
      'ivory': 'ivory-toned vintage paper',
      'beige': 'beige antique paper',
      'light-ochre': 'light ochre aged paper',
      'faded-newsprint': 'faded newsprint paper'
    };

    function generatePrompt(data) {
      const color = COLOR_MAP[data.color] || data.color;
      const paper = PAPER_MAP[data.paper] || data.paper;
      const subject = data.subject;
      const text = data.text || '';
      const layout = data.layout;
      const anchor = data.anchor;
      const mood = data.mood;
      const texture = data.texture;

      const layoutDesc = {
        'center-fragment': 'A tiny central visual cluster occupying about 12% of the frame, surrounded by vast empty space.',
        'lower-left-float': 'A small anchor in the lower-left quadrant, with abundant empty space above and to the right.',
        'upper-right-block': 'A small color/photo block in the upper-right region, with loose text drifting in the remaining space.',
        'dual-panel': 'Two small overlapping or adjacent panels with a narrow gap, creating a quiet diptych rhythm.',
        'irregular-cutout': 'A torn or organic paper shape carrying the image, with rough edges against the paper void.',
        'type-led': 'Typography is the primary visual anchor; the image element is secondary or minimal.',
        'single-specimen': 'One isolated object or mark placed as a specimen, with almost no support graphics.'
      }[layout] || 'A small visual cluster occupying about 15% of the canvas, placed with generous negative space.';

      const p1 = `A tall vertical 3:5 phone-poster format on ${paper}. Full-frame aged paper surface, no border, no mockup. 70% to 90% of the canvas is empty paper. ${layoutDesc}`;

      const anchorDesc = {
        'tiny-faded-photo': `a tiny faded black-and-white photograph of ${subject}, with softened edges and low contrast, appearing as a found archival print`,
        'torn-paper-clipping': `a torn-paper clipping featuring ${subject}, with rough deckled edges and a slightly yellowed paper fragment`,
        'flat-silhouette': `a flat silhouette of ${subject}, rendered as a solid cutout with clean edges against the paper void`,
        'solid-color-block': `a solid color block in the shape or suggestion of ${subject}, acting as a bold graphic anchor`,
        'old-printed-illustration': `an old printed illustration of ${subject}, with visible halftone dots and ink fading from age`,
        'object-specimen': `a single specimen of ${subject}, isolated like a museum object with a subtle shadow or pin`,
        'translucent-geometric': `a translucent geometric overlay suggesting ${subject}, with layered semi-opaque shapes`,
        'abstract-texture': `an abstract texture window evoking ${subject}, with organic marks and rubbed ink`
      }[anchor] || `a small visual representation of ${subject}`;

      const p2 = `The image anchor is ${anchorDesc}. The anchor treatment uses low-contrast photocopy softness, with subtle ink bleed and a slightly misregistered feel that makes it belong to the paper.`;

      const textLine = text
        ? `A short readable phrase: "${text}". `
        : `A short poetic phrase related to "${subject}" appears as small serif type. `;

      const p3 = `${textLine}Small serif or typewriter typography, set in a sparse arrangement. The single high-chroma accent is ${color}, occupying about 1.5% of the canvas or 20% of the visual cluster — clearly visible at thumbnail size. Print defects include ${texture.replace(/-/g, ' ')}, with subtle scan noise and paper fiber texture throughout.`;

      const moodMap = {
        'quiet': 'quiet, contemplative, sparse, diary-like',
        'summer': 'warm, nostalgic summer, hazy afternoon light',
        'solitude': 'solitary, introspective, distant, meditative',
        'childhood': 'childhood memory, nostalgic, faded, tender',
        'seaside': 'seaside atmosphere, salt air, coastal quiet',
        'afternoon': 'lazy afternoon, warm light, stillness',
        'night': 'nocturnal, hushed, dim, shadowy, lunar',
        'memory': 'memory-like, archival, distant, ephemeral',
        'slight-surrealism': 'slightly surreal, dream-adjacent, uncanny quiet'
      }[mood] || 'quiet, poetic, archival';

      const p4 = `Flat orthographic scanned-paper appearance. Matte absorbent paper, diffuse light, low-to-medium contrast. The overall mood is ${moodMap}: a Japanese/Korean indie zine or minimal editorial poster. No full-bleed scene, no commercial headline, no glossy mockup, no 3D, no cinematic lighting, no neon, no dense composition, no long clean text blocks.`;

      return [p1, p2, p3, p4].join('\n\n');
    }

    // =============================================
    // UI State
    // =============================================
    const state = {
      color: 'orange',
      paper: 'warm-cream',
      layout: 'dual-panel',
      anchor: 'flat-silhouette',
      texture: 'risograph-grain',
      mood: 'quiet'
    };

    // =============================================
    // Render Functions
    // =============================================
    const container = document.getElementById('skillsContainer');
    const detail = document.getElementById('skillDetail');
    const closeBtn = document.getElementById('closeDetail');
    const form = document.getElementById('promptForm');
    const output = document.getElementById('promptOutput');
    const result = document.getElementById('promptResult');
    const copyBtn = document.getElementById('copyBtn');
    const regenBtn = document.getElementById('regenerateBtn');
    const toast = document.getElementById('toast');

    // Skill cards with images
    skills.forEach(skill => {
      const card = document.createElement('div');
      card.className = 'skill-card reveal';
      card.style.cursor = 'pointer';
      const img = skill.examples[0] ? `/ai-skills/examples/${skill.examples[0]}` : '';
      card.innerHTML = `
        <div class="skill-card-img">
          <img src="${img}" alt="${skill.title}" loading="lazy">
        </div>
        <div class="skill-card-body">
          <div class="skill-card-tags">
            ${skill.tags.map(t => `<span>${t}</span>`).join('')}
            <span style="background:var(--accent-1);color:#fff;">可交互</span>
          </div>
          <h3>${skill.title}</h3>
          <p>${skill.desc}</p>
          <span class="card-link">试试生成 →</span>
        </div>
      `;
      card.addEventListener('click', () => openSkill(skill));
      container.appendChild(card);
    });

    // Color swatches
    const colorContainer = document.getElementById('colorSwatches');
    colors.forEach(c => {
      const el = document.createElement('div');
      el.className = `color-swatch${c.id === state.color ? ' selected' : ''}`;
      el.style.background = c.hex;
      if (c.id === 'lemon-yellow') el.style.border = '2px solid #ddd';
      el.innerHTML = `<span class="tooltip">${c.label}</span>`;
      el.dataset.value = c.id;
      el.addEventListener('click', () => {
        colorContainer.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected');
        state.color = c.id;
      });
      colorContainer.appendChild(el);
    });

    // Paper chips
    const paperContainer = document.getElementById('paperChips');
    papers.forEach(p => {
      const el = document.createElement('div');
      el.className = `chip-option${p.id === state.paper ? ' selected' : ''}`;
      el.textContent = p.label;
      el.dataset.value = p.id;
      el.addEventListener('click', () => {
        paperContainer.querySelectorAll('.chip-option').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected');
        state.paper = p.id;
      });
      paperContainer.appendChild(el);
    });

    // Layout diagrams
    const layoutContainer = document.getElementById('layoutGrid');
    const layoutDiagrams = {
      'center-fragment': { dots: [{ x: 38, y: 35, w: 24, h: 30 }] },
      'lower-left-float': { dots: [{ x: 5, y: 55, w: 28, h: 35 }] },
      'upper-right-block': { dots: [{ x: 55, y: 5, w: 30, h: 25 }] },
      'dual-panel': { dots: [{ x: 10, y: 20, w: 35, h: 25 }, { x: 50, y: 50, w: 35, h: 25 }] },
      'irregular-cutout': { dots: [{ x: 20, y: 25, w: 40, h: 45, clip: true }] },
      'type-led': { dots: [{ x: 15, y: 30, w: 55, h: 8 }, { x: 15, y: 45, w: 40, h: 8 }, { x: 15, y: 60, w: 50, h: 8 }] },
      'single-specimen': { dots: [{ x: 30, y: 30, w: 30, h: 35 }] }
    };

    layouts.forEach(l => {
      const el = document.createElement('div');
      el.className = `layout-option${l.id === state.layout ? ' selected' : ''}`;
      const diag = layoutDiagrams[l.id] || { dots: [{ x: 30, y: 30, w: 30, h: 30 }] };
      let dots = diag.dots.map(d => {
        const style = `left:${d.x}%;top:${d.y}%;width:${d.w}%;height:${d.h}%`;
        return `<div class="dot${d.clip ? ' color-block' : ''}" style="${style}"></div>`;
      }).join('');
      el.innerHTML = `<div class="layout-diagram">${dots}</div><div class="label">${l.label}</div>`;
      el.dataset.value = l.id;
      el.addEventListener('click', () => {
        layoutContainer.querySelectorAll('.layout-option').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected');
        state.layout = l.id;
      });
      layoutContainer.appendChild(el);
    });

    // Anchor grid
    const anchorContainer = document.getElementById('anchorGrid');
    anchors.forEach(a => {
      const el = document.createElement('div');
      el.className = `anchor-option${a.id === state.anchor ? ' selected' : ''}`;
      el.innerHTML = `<span class="icon">${a.icon}</span><div class="label">${a.label}</div>`;
      el.dataset.value = a.id;
      el.addEventListener('click', () => {
        anchorContainer.querySelectorAll('.anchor-option').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected');
        state.anchor = a.id;
      });
      anchorContainer.appendChild(el);
    });

    // Texture chips
    const textureContainer = document.getElementById('textureChips');
    textures.forEach(t => {
      const el = document.createElement('div');
      el.className = `chip-option${t.id === state.texture ? ' selected' : ''}`;
      el.textContent = t.label;
      el.dataset.value = t.id;
      el.addEventListener('click', () => {
        textureContainer.querySelectorAll('.chip-option').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected');
        state.texture = t.id;
      });
      textureContainer.appendChild(el);
    });

    // Mood chips
    const moodContainer = document.getElementById('moodChips');
    moods.forEach(m => {
      const el = document.createElement('div');
      el.className = `chip-option${m.id === state.mood ? ' selected' : ''}`;
      el.textContent = m.label;
      el.dataset.value = m.id;
      el.addEventListener('click', () => {
        moodContainer.querySelectorAll('.chip-option').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected');
        state.mood = m.id;
      });
      moodContainer.appendChild(el);
    });

    // =============================================
    // Skill Detail Logic
    // =============================================
    function openSkill(skill) {
      document.getElementById('detailTitle').textContent = skill.title;
      document.getElementById('detailTags').innerHTML = skill.tags.map(t => `<span>${t}</span>`).join('');
      document.getElementById('detailDesc').textContent = skill.desc;

      // Banner: cycle through example images
      const banner = document.getElementById('detailBanner');
      const img = skill.examples[1] || skill.examples[0] || '';
      banner.innerHTML = img ? `<img src="/ai-skills/examples/${img}" alt="${skill.title}">` : '';

      detail.classList.add('active');
      output.classList.remove('active');
      detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    closeBtn.addEventListener('click', () => {
      detail.classList.remove('active');
      output.classList.remove('active');
    });

    // Form submit
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const subject = document.getElementById('fSubject').value.trim();
      if (!subject) {
        document.getElementById('fSubject').focus();
        showToast('请填写主题/主体');
        return;
      }
      const data = {
        subject,
        text: document.getElementById('fText').value.trim(),
        color: state.color,
        paper: state.paper,
        layout: state.layout,
        anchor: state.anchor,
        texture: state.texture,
        mood: state.mood
      };
      const prompt = generatePrompt(data);
      result.value = prompt;
      output.classList.add('active');
      copyBtn.textContent = '📋 复制';
      copyBtn.classList.remove('copied');
      result.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    regenBtn.addEventListener('click', () => form.dispatchEvent(new Event('submit')));

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(result.value);
        copyBtn.textContent = '✅ 已复制';
        copyBtn.classList.add('copied');
        showToast('Prompt 已复制到剪贴板');
      } catch {
        result.select();
        document.execCommand('copy');
        copyBtn.textContent = '✅ 已复制';
        copyBtn.classList.add('copied');
      }
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
