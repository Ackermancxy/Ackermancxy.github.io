<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CXY 的个人网站 — 摄影与 AI 创作">
  <title>CXY · 个人站</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">CXY</a>
      <ul class="nav-links">
        <li><a href="/">首页</a></li>
        <li><a href="/photography/">摄影</a></li>
        <li><a href="/ai-skills/">AI 技能</a></li>
        <li>
          <button id="themeToggle" class="theme-toggle" aria-label="切换主题">☀️</button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <p class="hero-subtitle reveal">CXY · 创造者</p>
    <h1 class="hero-title reveal">取景框内外</h1>
    <p class="hero-desc reveal">
      记录镜头下的光影，探索 AI 时代的视觉语言。<br>
      这里是我的摄影作品与 AI 创作工坊。
    </p>
    <div class="hero-scroll">
      <span>向下探索</span>
      <div class="arrow"></div>
    </div>
  </section>

  <!-- Projects -->
  <section class="section" id="projects">
    <div class="container">
      <h2 class="section-title reveal">项目</h2>
      <div class="project-grid">
        <a href="/photography/" class="project-card reveal">
          <span class="project-card-icon">📷</span>
          <h3>摄影作品</h3>
          <p>用镜头定格瞬间，在光影中寻找故事。收录我拍摄的胶片与数字摄影作品。</p>
          <span class="card-link">进入画廊</span>
        </a>
        <a href="/ai-skills/" class="project-card reveal">
          <span class="project-card-icon">✨</span>
          <h3>AI 作图技能</h3>
          <p>收集和分享 AI 图像生成的技巧与工作流，从 prompt 工程到风格化输出。</p>
          <span class="card-link">查看技能</span>
        </a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 CXY · 用光影与代码书写</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
