<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CXY 的个人站">
  <title>CXY的个人站</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">CXY</a>
      <ul class="nav-links">
        <li><a href="/">首页</a></li>
        <li><a href="/photography/">摄影</a></li>
        <li><a href="/ai-skills/">AI skills分享</a></li>
        <li>
          <button id="themeToggle" class="theme-toggle" aria-label="切换主题">☀️</button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <p class="hero-subtitle reveal">CXY</p>
    <h1 class="hero-title reveal">框内，框外</h1>
    <p class="hero-desc reveal">
      摄影 · AI 图像 · 小分享
    </p>
  </section>

  <!-- Projects -->
  <section class="section" id="projects">
    <div class="container">
      <h2 class="section-title reveal">作品与方法</h2>
      <div class="project-grid">
        <a href="/photography/" class="project-card reveal">
          <span class="project-card-icon">📷</span>
          <h3>摄影选辑</h3>
          <p>一些胶片和数码照片</p>
          <span class="card-link">浏览影集</span>
        </a>
        <a href="/ai-skills/" class="project-card reveal">
          <span class="project-card-icon">✨</span>
          <h3>AI 图像方法</h3>
          <p>AI 图像生成的技巧和踩坑记录</p>
          <span class="card-link">阅读方法</span>
        </a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 CXY</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
